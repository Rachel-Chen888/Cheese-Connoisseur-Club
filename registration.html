<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <header>
        <h1>Cheese Connoisseur Club</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="schedule.html">Schedule</a>
            <a href="registration.html">Registration</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Register for the Cheese Connoisseur Club</h2>
            <p>Join us and become a member of the most exclusive cheese appreciation society!</p>
            <small>Fill out all of the required fields.</small>
            <small>We swear this isn't a threat.</small>
             <!---Putting Form Skeleton here for now-->
            <!---TODO: NEED 6 fields/controls!!!-->
            <form action="#" method="post">
                <fieldset>
                    <legend>Registration Form</legend>
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="firstname" required minlength="2" maxlength="6000">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" required minlength="2" maxlength="6000">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="SSN">SSN:</label>
                    <input type="number" id="SSN" name="SSN" required min="100000000" max="999999999"> <!---Need to configure this to actually match SSN number-->
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" minlength="8" required> <!---Need to add validation-->
                    <label for="age">Age:</label>
                    <input type="range" min="1" max="100" value="100" class="slider" id="age" name="age" oninput="document.getElementById('ageValue').textContent = this.value;" required>
                    <output id="ageValue">100</output>
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I pledge allegiance to the flag of the Cheese, and to the republic for which it stands, one nation under Cheese, indivisible Cheese, with liberty Cheese and justice Cheese for all Cheese.</label>
                    <button type="submit">Register</button>
                </fieldset>
            </form>
        </section>
    </main>
   

    <footer>
         <img src="Images/cheese_icon_png.png" alt="Cheese Icon" width="70">
        <p>&copy; 2026 CSI 3140 Lab 1</p>
    </footer>
</body>
</html>
