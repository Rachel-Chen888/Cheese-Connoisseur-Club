<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="script.js"></script>
</head>
<body class="register-page">
    <header class="site-header">
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="schedule.html">Schedule</a>
            <a href="registration.html">Registration</a>
        </nav>
        <h1>Cheese Connoisseur Club</h1>
    </header>

    <!---Add radio buttons, dropdown menus, and multiple choice (checkboxes)-->
    <main>
        <div class="content-header">
                <h2>Register for the Cheese Connoisseur Club</h2>
                <p>Join us and become a member of the most exclusive cheese appreciation society!</p>
                <small>Fill out all of the required fields.</small>
        </div>
        <section class = "container">

            <!--Redirect to index on success-->
            <form action="#" method="post" class="register-form">
                <fieldset>
                    <legend>Registration Form</legend>
                    <h2>Register Here!</h2>
                    

                    <div class="form-input">
                        <label for="firstname">First Name:<span class ="required">*</span></label>
                        <input type="text" id="firstname" name="firstname" required minlength="2" maxlength="6000">
                    </div>
                    
                    <div class="form-input">
                        <label for="lastname">Last Name:<span class ="required">*</span></label>
                        <input type="text" id="lastname" name="lastname" required minlength="2" maxlength="6000">
                    </div>

                    <div class="form-input">
                        <label for="email">Email:<span class ="required">*</span></label>
                        <input type="email" id="email" name="email" maxlength="6000" required>
                    </div>

                    <div class="form-input">
                        <!---Need to add text to specify SSN format-->
                        <label for="SSN">SSN:<span class ="required">*</span></label>
                        <input type="text" id="SSN" name="SSN" pattern="[0-9]{9}" required>
                    </div>

                    <div class="form-input">
                        <label for="phone">Phone Number:<span class ="required">*</span></label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
                    </div>

                    <div class="form-input">
                        <label for="password">Password:<span class ="required">*</span></label>
                        <input type="password" id="password" name="password" minlength="8" maxlength="6000" required> <!---Need to add validation-->
                    </div>

                   <div class="form-input slider-group">
                        <label for="age">Age:<span class ="required">*</span></label>
                        <input type="range" min="1" max="100" value="100" class="slider" id="age" name="age" oninput="document.getElementById('ageValue').textContent = this.value;">
                        <output id="ageValue">100</output>
                    </div>

                    <div class="form-input">
                        <label for="gender">Gender:<span class ="required">*</span></label>
                        <select id="gender" name="gender" required>
                            <option value="">Select an option</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="cheese">Cheese</option>
                        </select>
                    </div>

                    <div class="form-input radio-grid">

                        <label class="group-label">
                            Cheese Knowledge Level:
                        </label>

                        <div class="radio-grid">
                            <label for="beginner">Beginner <input type="radio" id="beginner"
                                name="cheese_knowledge"
                                value="beginner" required></label>
                            
                                                       
                            <label for="intermediate">Intermediate <input type="radio" id="intermediate"
                                name="cheese_knowledge"
                                value="intermediate"></label>
                            

                            
                            <label for="expert">Expert <input type="radio" id="expert"
                                name="cheese_knowledge"
                                value="expert"></label>

                            <label for="god">GOD <input type="radio" id="god"
                                name="cheese_knowledge"
                                value="god"></label>

                        </div>

                    </div>

                    <div class="form-input textarea">
                        <label for="favorite_cheese">Favorite Cheese:<span class ="required">*</span></label>
                        <textarea id="favorite_cheese" name="favorite_cheese" rows="4" maxlength="6000" required></textarea>
                    </div>

                    <div class="form-input checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms"><span class ="required">*</span> I pledge allegiance to the Cheese Connoisseur Club, and to the republic for which it stands, one nation under Cheese, indivisible, with liberty and justice for all Cheese lovers, appreciators and connoisseurs.</label>
                    </div>

                    <div class="submit">
                        <button type="submit">Register</button>
                        <!---Need the button to redirect the user upon successful registration-->
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
   

    <footer>
        <img src="Images/cheese_icon_png.png" alt="Cheese Icon" width="70">
        <p>&copy; 2026 CSI 3140 Lab 1</p>
    </footer>
</body>
</html>
